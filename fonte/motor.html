<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1713">
<meta name="description" content="Valcorte, 1348. Seja o escrivão da rainha, equilibre Fé, Povo, Nobreza e Tesouro, e volte no tempo sempre que morrer.">
<title>A Ampulheta de Cinzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap">
<style>
:root{
  --ink:#1b1713;--ink2:#241f19;--ink3:#2f2820;--line:#4b4237;--line2:#6b5d4b;
  --paper:#e9ddc4;--vellum:#e2d3b3;--mute:#a69a85;--faint:#7a6f5e;
  --lapis:#2f4a8f;--lapis2:#24396f;--gold:#c9a24a;--rubric:#b4463a;--verd:#7fae9c;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --black:"UnifrakturMaguntia","IM Fell English",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;max-width:520px;margin:0 auto;position:relative}
.screen{height:100%;display:flex;flex-direction:column}

/* ---------- abertura ---------- */
#title{align-items:center;justify-content:center;gap:18px;padding:24px 22px;text-align:center;overflow-y:auto}
.sigilo{width:40px;height:60px;flex:none}
.sigilo .aT{transform-origin:32px 37px;animation:aT 12s ease-in infinite}
.sigilo .aB{transform-origin:32px 84px;animation:aB 12s ease-out infinite}
.sigilo .fio{animation:fio .9s linear infinite}
@keyframes aT{0%{transform:scaleY(1)}95%{transform:scaleY(.08)}100%{transform:scaleY(1)}}
@keyframes aB{0%{transform:scaleY(.15)}95%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@keyframes fio{to{stroke-dashoffset:-4}}
.marca{display:flex;align-items:stretch;gap:12px;margin:0;text-align:left;font-weight:400}
.marca .cap{flex:none;width:74px;display:grid;place-items:center;background:var(--lapis);color:var(--gold);font-family:var(--black);font-size:62px;line-height:1;padding-top:6px;box-shadow:inset 0 0 0 2px var(--lapis),inset 0 0 0 3px var(--gold)}
.marca .tx{display:flex;flex-direction:column;justify-content:center}
.marca .l1{font-family:var(--black);font-size:clamp(38px,11vw,50px);line-height:1}
.marca .l2{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--mute);margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pitch{font-family:var(--serif);font-size:18px;line-height:1.5;max-width:30ch;margin:0;color:var(--paper)}
.pitch em{color:var(--mute)}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.btn{display:block;width:100%;min-height:50px;padding:12px 16px;border-radius:3px;border:1px solid var(--line);background:var(--ink3);text-align:center;font-weight:500}
.btn:hover{border-color:var(--line2);background:#352d24}
.btn.main{background:var(--lapis);border-color:var(--lapis);box-shadow:inset 0 -3px 0 var(--lapis2);font-weight:700;font-size:17px}
.btn.main:hover{background:#3a58a6}
.btn.ghost{background:none}
.btn small{display:block;font-weight:400;font-size:13px;color:#c9cfe3;margin-top:1px}
.foot{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--faint);max-width:34ch;margin:0}
.foot a{color:var(--mute)}

/* ---------- jogo ---------- */
#game{padding:10px 16px 12px;gap:8px}
.top{display:flex;align-items:center;gap:10px}
.top .act{flex:1;min-width:0}
.top .act b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .act span{font-size:13px;color:var(--mute)}
.chip{flex:none;min-height:38px;padding:6px 12px;border-radius:3px;border:1px solid var(--line);background:var(--ink2);font-size:14px}
.ret{flex:none;font-size:13px;color:var(--mute);text-align:right;line-height:1.2}
.ret b{display:block;color:var(--paper);font-size:16px;font-weight:700}
.goal{border-left:3px solid var(--gold);padding:4px 0 4px 10px;font-size:14.5px;line-height:1.35}
.goal i{display:block;font-style:normal;font-size:12.5px;color:var(--mute)}
.prog{height:3px;background:var(--ink3);margin-top:6px}.prog>i{display:block;height:100%;background:var(--gold);transition:width .4s}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.mt{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.mt .glass{width:40px;height:52px;position:relative}
.mt .glass svg{position:absolute;inset:0;width:100%;height:100%}
.mt .fill{transition:height .45s ease,y .45s ease}
.mt .nm{font-size:12.5px;color:var(--mute)}
.mt .dot{position:absolute;top:-8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--paper);opacity:0;transform:scale(.3);transition:opacity .12s,transform .12s}
.mt .dot.on{opacity:1;transform:scale(1)}.mt .dot.big{width:12px;height:12px;margin-left:-6px;top:-10px}
.mt .dot.up{background:#9cc98a}.mt .dot.dn{background:#e07a6a}
.mt.warn .nm{color:#e8a08f;font-weight:700}
.mt.warn .glass{animation:wn 1.1s ease-in-out infinite}
@keyframes wn{50%{transform:translateY(-2px)}}
.q{min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.4;padding:0 4px;white-space:pre-line}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.card{--k:#5a4a35;height:min(100%,330px);aspect-ratio:3/4;max-width:82%;background:var(--vellum);border:1px solid #8c7b5d;border-radius:4px;position:relative;
  box-shadow:inset 0 0 0 7px var(--vellum),inset 0 0 0 8px var(--k),inset 0 0 0 10px var(--vellum),inset 0 0 0 11px var(--k),0 22px 34px -20px #000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:#2a2118}
.card .ini{font-family:var(--black);font-size:clamp(92px,30vw,140px);line-height:1;color:var(--k)}
.card .orn{position:absolute;inset:18px;pointer-events:none;opacity:.22;color:var(--k)}
.card .lab{position:absolute;left:16px;right:16px;top:18px;padding:8px 10px;background:rgba(27,23,19,.9);color:var(--paper);font-size:15px;line-height:1.3;border-radius:2px;opacity:0;transition:opacity .12s;text-align:left}
.card .lab.r{text-align:right}
.card .lab.on{opacity:1}
.card.narr .ini{font-family:var(--serif);font-size:56px;color:#6b5a40}
.who{text-align:center;min-height:44px}
.who b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.15}
.who span{font-size:13px;color:var(--mute)}
.hint{text-align:center;font-size:13.5px;color:var(--mute);min-height:20px}
.hint.alert{color:#e8a08f}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices .btn{min-height:56px;font-size:15px;line-height:1.25;text-align:left;padding:10px 12px}
.choices .btn:last-child{text-align:right}
.choices .btn.mem::before{content:"⚠ ";color:#e8a08f}
.choices.one{grid-template-columns:1fr}.choices.one .btn{text-align:center}

/* ---------- painéis ---------- */
#ov{position:fixed;inset:0;z-index:20;background:rgba(14,11,8,.86);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#ov .box{width:min(520px,100%);max-height:calc(100% - 24px);overflow-y:auto;background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#ov h2{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.15;margin:0}
#ov h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:6px 0 0;color:var(--gold)}
#ov p{margin:0}
.kick{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:16px}
.body{font-family:var(--serif);font-size:18px;line-height:1.5;white-space:pre-line}
.mem{border-left:3px solid var(--rubric);padding:6px 0 6px 12px}
.mem b{display:block;color:#e8a08f;font-size:14px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{border-bottom:1px solid var(--line);padding-bottom:10px}
.list li b{display:block;font-family:var(--serif);font-weight:400;font-size:18px}
.list li span{font-size:14.5px;color:var(--mute)}
.list li.lock b{color:var(--faint)}
.death{background:#1a0f0d!important;border-color:#5a2a24!important}
.death h2{color:#f0c8bd}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:38px;padding:6px 12px;border-radius:3px;border:1px solid var(--line);background:none;font-size:14.5px}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.field{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 14px;font-family:var(--serif);font-size:22px;color:var(--paper);width:100%}
.field:focus{border-color:var(--gold);outline:none}
.how{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start}
.how svg{width:30px;height:38px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink3);border:1px solid var(--line2);border-radius:3px;padding:10px 16px;font-size:14.5px;max-width:90%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.q{min-height:76px;font-size:17.5px}.card{height:min(100%,270px)}.mt .glass{width:34px;height:44px}}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="screen">
  <svg class="sigilo" viewBox="0 0 64 96" aria-hidden="true">
   <g fill="none" stroke="#e9ddc4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 8h44M10 88h44"/><path d="M14 8v-3M50 8v-3M14 88v3M50 88v3"/><path d="M17 12v72M47 12v72" stroke-width="1.2"/>
    <path d="M21 12c0 16 9 22 11 36c2-14 11-20 11-36M21 84c0-16 9-22 11-36c2 14 11 20 11 36"/>
   </g>
   <path class="aT" d="M24 24h16c-1 6-4 10-8 13c-4-3-7-7-8-13z" fill="#c9a24a"/>
   <path class="aB" d="M23 84c1-7 4-11 9-12c5 1 8 5 9 12z" fill="#c9a24a"/>
   <path class="fio" d="M32 48v34" stroke="#c9a24a" stroke-width="1" stroke-dasharray="1.5 2.5"/>
  </svg>
  <h1 class="marca"><span class="cap" aria-hidden="true">A</span><span class="tx"><span class="l1"><span class="sr">A </span>Ampulheta</span><span class="l2">de Cinzas</span></span></h1>
  <p class="pitch">Valcorte, 1348. O rei foi envenenado e a Peste vem pelo mar. Você é o escrivão da rainha. <em>Quando morre, a areia volta, e só você lembra.</em></p>
  <div class="menu">
   <button class="btn main" id="tPlay"></button>
   <button class="btn" id="tHow">Como jogar</button>
   <button class="btn ghost" id="tMore">Diário, finais e ajustes</button>
  </div>
  <p class="foot">Uma história em cinco atos, contada em cartas. <a href="classico/">Versão clássica</a></p>
 </section>

 <section id="game" class="screen" hidden>
  <div class="top">
   <button class="chip" id="gMenu" aria-label="Diário">Diário</button>
   <div class="act"><b id="gAct"></b><span id="gDate"></span></div>
   <div class="ret" title="Vezes que a areia voltou"><b id="gRet">0</b>retornos</div>
  </div>
  <div class="goal" id="gGoal"></div>
  <div class="meters" id="gMeters"></div>
  <div class="q" id="gQ"></div>
  <div class="stage">
   <div class="card" id="gCard"><svg class="orn" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true"><path d="M50 4 L96 65 L50 126 L4 65 Z M50 22 L82 65 L50 108 L18 65 Z" fill="none" stroke="currentColor" stroke-width=".6"/></svg><span class="ini" id="gIni"></span><div class="lab" id="gLab"></div></div>
   <div class="who" id="gWho"></div>
  </div>
  <div class="hint" id="gHint"></div>
  <div class="choices" id="gCh"><button class="btn" id="gL"></button><button class="btn" id="gR"></button></div>
 </section>
</div>
<div id="ov" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- dados ---------- */
var CARDS={},POOL={1:[],2:[],3:[],4:[],5:[]},BAL=[];
function op(a){return {t:a[0],e:[a[1]||0,a[2]||0,a[3]||0,a[4]||0],x:a[5]||{}}}
function C(id,who,t,L,R,o){CARDS[id]={id:id,who:who,t:t,L:op(L),R:op(R),o:o||{}};return id}
var EMUL=1.5;function sc(a){return a.map(function(v,i){return i>=1&&i<=4?Math.round(v*EMUL):v})}
function P(act,id,who,t,L,R){C(id,who,t,sc(L),sc(R),{pool:1});POOL[act].push(id)}
function B(id,cond,who,t,L,R){C(id,who,t,sc(L),sc(R),{pool:1,bal:cond});BAL.push(id)}
/*HISTORIA*/

var MN=[["Fé","f"],["Povo","p"],["Nobreza","n"],["Tesouro","t"]];
var ICON=[
 '<path d="M20 6v40M10 18h20" stroke-width="2.4"/>',
 '<circle cx="12" cy="16" r="4"/><circle cx="28" cy="16" r="4"/><circle cx="20" cy="13" r="4.5"/><path d="M4 40c1-9 4-14 8-14s6 3 7 6M36 40c-1-9-4-14-8-14s-6 3-7 6M12 44c1-10 4-15 8-15s7 5 8 15"/>',
 '<path d="M6 34l3-20 7 8 4-12 4 12 7-8 3 20z"/><path d="M6 40h28"/>',
 '<ellipse cx="20" cy="14" rx="12" ry="4"/><path d="M8 14v6c0 2 5 4 12 4s12-2 12-4v-6M8 20v6c0 2 5 4 12 4s12-2 12-4v-6M8 26v6c0 2 5 4 12 4s12-2 12-4v-6"/>'
];
var MCOL=["#c9a24a","#7fae9c","#8a7fc4","#d08a4a"];

/* ---------- estado ---------- */
var META=lsGet("amp2_meta",{ends:[],deaths:[],mems:[],seenPeople:[],how:false,best:0});
var S=null;
function heroName(){var n=lsGet("amp2_nome","");return n||"Tomás"}
function fill(t){return String(t||"").replace(/\{N\}/g,heroName())}
function fresh(){return {act:1,bi:0,m:[50,50,50,50],flags:[],ret:0,deaths:0,queue:[],delay:[],gap:0,cur:null,cp:null,seen:{},broke:false,swipes:0,recent:[]}}
function save(){lsSet("amp2_save",S);lsSet("amp2_meta",META)}
function hasMem(k){return META.mems.indexOf(k)>=0}
function hasFlag(k){return S.flags.indexOf(k)>=0}
function learn(k,quiet){if(k&&!hasMem(k)){META.mems.push(k);if(!quiet)toast("Memória guardada: "+MEMS[k])}}
function checkpoint(){S.cp={m:S.m.map(function(v){return clamp(v,30,70)}),flags:S.flags.slice(),act:S.act,bi:S.bi}}

/* ---------- escolha da próxima carta ---------- */
function cardOk(c){var o=c.o;if(o.req&&!hasFlag(o.req))return false;if(o.not&&hasFlag(o.not))return false;if(o.once&&S.seen[c.id])return false;return true}
function resolveAlt(c){
  var o=c.o;if(!o.alt)return c;
  for(var i=0;i<o.alt.length;i++){var k=o.alt[i][0],ok=k.charAt(0)==="@"?hasFlag(k.slice(1)):hasMem(k);if(ok)return CARDS[o.alt[i][1]]}
  return c;
}
function balCard(){
  var list=BAL.filter(function(id){var b=CARDS[id].o.bal,v=S.m[b[0]];return (b[1]==="lo"&&v<=22)||(b[1]==="hi"&&v>=78)}).filter(function(id){return S.recent.indexOf(id)<0});
  return list.length?CARDS[rnd(list)]:null;
}
function poolCard(){
  var b=balCard();if(b&&Math.random()<0.7)return b;
  var list=POOL[S.act].filter(function(id){return S.recent.indexOf(id)<0});
  if(!list.length)list=POOL[S.act].slice();
  if(!list.length)return b;
  return CARDS[rnd(list)];
}
function nextCard(){
  /* consequências atrasadas */
  for(var i=0;i<S.delay.length;i++){if(S.delay[i][0]<=0){var id=S.delay.splice(i,1)[0][1];return show(CARDS[id])}}
  if(S.queue.length)return show(CARDS[S.queue.shift()]);
  if(S.gap>0){S.gap--;var p=poolCard();if(p)return show(p)}
  var beats=BEATS[S.act];
  while(S.bi<beats.length){var c=CARDS[beats[S.bi]];if(c&&cardOk(c))return show(resolveAlt(c),true);S.bi++}
  actEnd();
}
function beatDone(){S.bi++;if(S.bi%3===0&&S.bi<BEATS[S.act].length&&!S.queue.length){checkpoint();toast("Marco: a ampulheta guardou este ponto.")}S.gap=S.act===5&&S.broke?0:(Math.random()<0.5?1:2)}

/* ---------- tela ---------- */
function screen(id){["title","game"].forEach(function(s){$("#"+s).hidden=s!==id})}
function dateStr(){
  var a=ACTS[S.act-1],tot=BEATS[S.act].length,day=Math.round(a.d[0]+(a.d[1]-a.d[0])*Math.min(1,S.bi/Math.max(1,tot-1)));
  var M=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],L=[31,29,31,30,31,30,31,31,30,31,30,31],m=0;
  while(day>L[m]){day-=L[m];m++}
  return day+" de "+M[m]+" de 1348";
}
function glassSVG(i,v){
  var h=Math.round(36*v/100);
  return '<svg viewBox="0 0 40 52" aria-hidden="true"><rect x="2" y="2" width="36" height="48" rx="2" fill="#221c16" stroke="#6b5d4b"/>'+
   '<rect class="fill" x="2.5" y="'+(46.5-h)+'" width="35" height="'+(h+3)+'" fill="'+MCOL[i]+'" opacity=".9"/>'+
   '<line x1="4" y1="7" x2="36" y2="7" stroke="#b4463a" stroke-width=".8" stroke-dasharray="2 2"/><line x1="4" y1="45" x2="36" y2="45" stroke="#b4463a" stroke-width=".8" stroke-dasharray="2 2"/>'+
   '<g transform="translate(9 9) scale(.55)" fill="none" stroke="#efe3c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="paint-order:stroke">'+ICON[i]+'</g></svg>';
}
function meters(){
  var h="";for(var i=0;i<4;i++){var v=S.m[i],w=v<=18||v>=82;
    h+='<div class="mt'+(w?" warn":"")+'"><span class="dot" id="d'+i+'"></span><div class="glass">'+glassSVG(i,v)+'</div><span class="nm">'+MN[i][0]+'</span></div>'}
  $("#gMeters").innerHTML=h;
}
function warnText(){
  var t=[];for(var i=0;i<4;i++){if(S.m[i]<=18)t.push(MN[i][0]+" quase acabando");else if(S.m[i]>=82)t.push(MN[i][0]+" forte demais")}
  return t.length?"Cuidado: "+t.join(" · ")+". Nos dois extremos, você morre.":"";
}
var CUR=null,CURBEAT=false;
function show(c,beat){
  CUR=c;CURBEAT=!!beat;S.cur=c.id;S.curBeat=CURBEAT;save();
  screen("game");
  var a=ACTS[S.act-1];
  $("#gAct").textContent=a.n+" · "+a.t;$("#gDate").textContent=dateStr();$("#gRet").textContent=S.ret;
  var tot=BEATS[S.act].length,pg=Math.round(Math.min(1,S.bi/tot)*100);
  $("#gGoal").innerHTML='<i>Objetivo</i>'+esc(a.goal)+'<div class="prog"><i style="width:'+pg+'%"></i></div>';
  meters();
  $("#gQ").textContent=fill(c.t);
  var who=c.who,pp=PEOPLE[who],card=$("#gCard");
  card.className="card"+(c.narr?" narr":"");card.style.transform="";card.style.transition="";
  card.style.setProperty("--k",pp?mix(pp.c):"#5a4a35");
  $("#gIni").textContent=c.narr?"❦":(who?who.charAt(0):"·");
  $("#gWho").innerHTML=who?'<b>'+esc(who)+'</b><span>'+esc(pp?pp.r:"")+'</span>':(c.narr?'':'<span>'+(c.o.pool?"":"")+'</span>');
  if(who&&META.seenPeople.indexOf(who)<0)META.seenPeople.push(who);
  var w=warnText();$("#gHint").textContent=w||(c.narr?"":"Arraste a carta para um lado ou toque numa resposta.");$("#gHint").className="hint"+(w?" alert":"");
  var L=$("#gL"),R=$("#gR"),ch=$("#gCh");
  L.textContent=fill(c.L.t);R.textContent=fill(c.R.t);
  L.className="btn"+(danger(c.L)?" mem":"");R.className="btn"+(danger(c.R)?" mem":"");
  ch.className="choices"+(c.narr?" one":"");R.hidden=!!c.narr;
  bind();
}
function mix(hex){/* escurece a cor do personagem para tinta sobre pergaminho */
  var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return "rgb("+Math.round(r*.55+42*.45)+","+Math.round(g*.55+31*.45)+","+Math.round(b*.55+20*.45)+")";
}
function danger(o){return o.x.die&&DEATHS[o.x.die]&&DEATHS[o.x.die][2]&&hasMem(DEATHS[o.x.die][2])}
function preview(side){
  var c=CUR,e=side?c[side].e:[0,0,0,0];
  for(var i=0;i<4;i++){var d=$("#d"+i);if(!d)continue;var v=e[i];d.className="dot"+(v?" on":"")+(Math.abs(v)>=10?" big":"")+(v>0?" up":v<0?" dn":"")}
  var lab=$("#gLab");
  if(side&&!c.narr){lab.textContent=fill(c[side].t);lab.className="lab on"+(side==="R"?" r":"")}else lab.className="lab";
}
function bind(){
  var card=$("#gCard"),sx=0,dx=0,drag=false,done=false,last=null;
  card.onpointerdown=function(e){if(done)return;drag=true;sx=e.clientX;dx=0;try{card.setPointerCapture(e.pointerId)}catch(_){}card.style.transition="none"};
  card.onpointermove=function(e){if(!drag)return;dx=e.clientX-sx;card.style.transform="translateX("+dx+"px) rotate("+(dx/18)+"deg)";var s=dx<-28?"L":dx>28?"R":null;if(CUR.narr)s=null;if(s!==last){last=s;preview(s)}};
  function up(){if(!drag)return;drag=false;card.style.transition="transform .2s";
    if(Math.abs(dx)>85){done=true;var s=CUR.narr?"L":(dx<0?"L":"R");card.style.transform="translateX("+(dx<0?-600:600)+"px) rotate("+(dx<0?-24:24)+"deg)";setTimeout(function(){pick(s)},170)}
    else{card.style.transform="";last=null;preview(null)}}
  card.onpointerup=up;card.onpointercancel=up;
  var L=$("#gL"),R=$("#gR");
  L.onclick=function(){if(!done){done=true;pick("L")}};R.onclick=function(){if(!done){done=true;pick("R")}};
  L.onmouseenter=L.onfocus=function(){if(!CUR.narr)preview("L")};R.onmouseenter=R.onfocus=function(){preview("R")};
  L.onmouseleave=L.onblur=R.onmouseleave=R.onblur=function(){preview(null)};
  document.onkeydown=function(e){if($("#game").hidden||done||!$("#ov").hidden)return;if(e.key==="ArrowLeft"){done=true;pick("L")}else if(e.key==="ArrowRight"&&!CUR.narr){done=true;pick("R")}};
}

/* ---------- jogar uma carta ---------- */
function pick(side){
  var c=CUR,o=c[side],x=o.x;
  if(c.narr){if(c.after)c.after();return}
  S.swipes++;S.seen[c.id]=1;S.recent.push(c.id);if(S.recent.length>6)S.recent.shift();
  for(var i=0;i<S.delay.length;i++)S.delay[i][0]--;
  if(x.die){return die(x.die)}
  for(var j=0;j<4;j++)S.m[j]=clamp(S.m[j]+o.e[j],0,100);
  if(x.set&&!hasFlag(x.set))S.flags.push(x.set);
  if(x.mem)learn(x.mem);
  if(x.delay)S.delay.push([x.delay[0],x.delay[1]]);
  if(x.brk){S.broke=true;toast("As ampulhetas se partiram. Daqui em diante, não há volta.")}
  if(S.curBeat)beatDone();
  if(x.nx)S.queue.unshift(x.nx);
  if(x.end){return ending(x.end==="auto"?autoEnd():x.end)}
  for(var k=0;k<4;k++){if(S.m[k]<=0||S.m[k]>=100){return die(MN[k][1]+(S.m[k]<=0?"0":"1"),true)}}
  save();nextCard();
}
function autoEnd(){if(!hasFlag("duarte_preso"))return "cinzas";return hasFlag("contou")?"lembra":"meia"}

/* ---------- morte e retorno ---------- */
function die(id,meter){
  var D=meter?MDIE[id]:DEATHS[id];if(!D)D=["Fim","A areia escorre."];
  S.deaths++;if(META.deaths.indexOf(id)<0)META.deaths.push(id);
  if(S.broke)return ending("sem");
  var mk=!meter&&D[2];if(mk)learn(mk,true);
  var queenDied=id==="rainha";
  S.ret++;save();
  var hint=meter?("Medidor: "+MN[id.charAt(0)==="f"?0:id.charAt(0)==="p"?1:id.charAt(0)==="n"?2:3][0]+(id.charAt(1)==="0"?" chegou a zero.":" chegou ao máximo.")+" Mantenha os quatro longe das duas pontas."):"";
  ovl('<div class="box death"><p class="kick">'+(queenDied?"Não foi você quem morreu":"Retorno "+S.ret)+'</p><h2>'+esc(D[0])+'</h2><p class="body">'+esc(fill(D[1]))+'</p>'+
   (mk?'<div class="mem"><b>Você vai lembrar</b>'+esc(MEMS[mk])+'</div>':'')+(hint?'<p style="color:var(--mute)">'+esc(hint)+'</p>':'')+
   '<p style="color:var(--mute)">A areia volta ao último marco do '+ACTS[S.act-1].n+'. Tudo o que você aprendeu continua com você.</p>'+
   '<button class="btn main" id="oBack">Virar a ampulheta</button></div>');
  $("#oBack").onclick=function(){ovlClose();restart()};
}
function restart(){
  var cp=S.cp;S.m=cp.m.slice();S.flags=cp.flags.slice();S.act=cp.act;S.bi=cp.bi||0;S.queue=[];S.delay=[];S.gap=0;S.seen={};S.recent=[];
  save();
  showNarr("Retorno "+S.ret,rnd(["A areia sobe de volta. O cheiro de cinzas some. Você já sabe o que não fazer.","O mundo recomeça do último marco. A memória, só você guarda.","Você respira fundo. O corpo é novo de novo. A cabeça, nunca."]),function(){nextCard()});
}

/* ---------- atos ---------- */
function showNarr(title,text,after){
  var c={id:"narr",who:"",t:(title?title+"\n\n":"")+text,narr:true,L:{t:"Continuar",e:[0,0,0,0],x:{}},R:{t:"",e:[0,0,0,0],x:{}},o:{},after:after};
  show(c);
}
function actIntro(){
  var a=ACTS[S.act-1];checkpoint();save();
  ovl('<div class="box"><p class="kick">'+a.n+'</p><h2>'+esc(a.t)+'</h2><p class="body">'+esc(fill(a.intro))+'</p><div class="goal" style="font-size:16px"><i>Objetivo do ato</i>'+esc(a.goal)+'</div><button class="btn main" id="oGo">Começar</button></div>');
  $("#oGo").onclick=function(){ovlClose();nextCard()};
}
function actEnd(){
  var a=ACTS[S.act-1];
  if(S.act>=5){return ending(autoEnd())}
  ovl('<div class="box"><p class="kick">Fim do '+a.n+'</p><h2>'+esc(a.t)+'</h2><p class="body">'+esc(fill(a.outro))+'</p><button class="btn main" id="oNx">Seguir para o '+ACTS[S.act].n+'</button></div>');
  $("#oNx").onclick=function(){ovlClose();S.act++;S.bi=0;S.queue=[];S.delay=[];S.gap=0;S.seen={};for(var i=0;i<4;i++)S.m[i]=clamp(Math.round(S.m[i]*.5+25),35,65);if(S.act>META.best)META.best=S.act;save();actIntro()};
}
function ending(id){
  var E=ENDS[id];if(META.ends.indexOf(id)<0)META.ends.push(id);S.ended=id;save();
  ovl('<div class="box"><p class="kick">Final '+(Object.keys(ENDS).indexOf(id)+1)+' de '+Object.keys(ENDS).length+'</p><h2>'+esc(E[0])+'</h2><p class="body">'+esc(fill(E[1]))+'</p>'+
   '<p style="color:var(--mute)">Retornos nesta história: '+S.ret+'. Finais encontrados: '+META.ends.length+' de '+Object.keys(ENDS).length+'.</p>'+
   '<button class="btn main" id="oA5">Jogar o Ato V de novo</button><button class="btn" id="oNew">Começar uma história nova</button><button class="btn ghost" id="oT">Voltar ao início</button></div>');
  $("#oA5").onclick=function(){ovlClose();S.ended=null;S.broke=false;S.act=5;S.m=S.cp&&S.cp.act===5?S.cp.m.slice():[50,50,50,50];S.flags=S.cp&&S.cp.act===5?S.cp.flags.slice():S.flags.filter(function(f){return f!=="quebrou"&&f!=="contou"});S.bi=0;S.queue=[];S.delay=[];S.seen={};save();actIntro()};
  $("#oNew").onclick=function(){ovlClose();newGame()};
  $("#oT").onclick=function(){ovlClose();toTitle()};
}

/* ---------- painéis ---------- */
function ovl(h){var o=$("#ov");o.innerHTML=h;o.hidden=false;var b=o.querySelector(".box");if(b)b.scrollTop=0}
function ovlClose(){$("#ov").hidden=true}
var tT=null;function toast(t){var e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(tT);tT=setTimeout(function(){e.hidden=true},3200)}
function howHTML(){
  var g='<div class="how">';
  g+='<svg viewBox="0 0 30 38"><rect x="3" y="3" width="24" height="32" rx="2" fill="#e2d3b3"/><path d="M8 19h14M18 15l4 4-4 4" stroke="#2a2118" stroke-width="1.6" fill="none"/></svg><p><b>Decida deslizando.</b> Cada carta é um pedido à rainha. Arraste para a esquerda ou para a direita, ou toque numa das respostas.</p>';
  g+='<svg viewBox="0 0 30 38"><rect x="5" y="3" width="20" height="32" rx="2" fill="#221c16" stroke="#6b5d4b"/><rect x="5.5" y="18" width="19" height="16" fill="#7fae9c"/><line x1="6" y1="7" x2="24" y2="7" stroke="#b4463a" stroke-dasharray="2 2"/><line x1="6" y1="31" x2="24" y2="31" stroke="#b4463a" stroke-dasharray="2 2"/></svg><p><b>Equilibre os quatro poderes.</b> Fé, Povo, Nobreza e Tesouro. Se um deles chegar a zero, você morre. Se chegar ao topo, também. Fique longe das linhas vermelhas.</p>';
  g+='<svg viewBox="0 0 30 38"><circle cx="9" cy="9" r="4" fill="#9cc98a"/><circle cx="21" cy="9" r="6" fill="#e07a6a"/></svg><p><b>Veja antes de escolher.</b> Ao arrastar, pontos aparecem sobre os medidores: verde sobe, vermelho desce, ponto grande muda muito.</p>';
  g+='<svg viewBox="0 0 30 38"><path d="M7 4h16M7 34h16M9 4c0 9 6 11 6 15s-6 6-6 15M21 4c0 9-6 11-6 15s6 6 6 15" stroke="#e9ddc4" fill="none" stroke-width="1.4"/></svg><p><b>Morrer faz parte.</b> A areia volta ao último marco do ato (a cada poucas cenas a ampulheta guarda um) e você guarda uma memória. Na próxima vez, aparecem opções novas, e as escolhas que já te mataram ganham um ⚠.</p>';
  g+='<svg viewBox="0 0 30 38"><path d="M6 6h18v26H6z" fill="none" stroke="#c9a24a" stroke-width="1.4"/><path d="M10 13h10M10 18h10M10 23h6" stroke="#c9a24a" stroke-width="1.2"/></svg><p><b>Siga o objetivo.</b> Ele fica sempre no alto da tela. A barra dourada mostra quanto falta para terminar o ato. São cinco atos e cinco finais.</p>';
  return g+'</div>';
}
function openHow(after){
  ovl('<div class="box"><p class="kick">Como jogar</p><h2>Escreva, equilibre, volte</h2>'+howHTML()+'<button class="btn main" id="oOk">Entendi</button></div>');
  $("#oOk").onclick=function(){META.how=true;lsSet("amp2_meta",META);ovlClose();if(after)after()};
}
function openDiary(tab){
  tab=tab||"obj";
  var tabs=[["obj","Objetivo"],["mem","Memórias"],["pes","Pessoas"],["fin","Finais"],["aju","Ajustes"]],h='<div class="box"><div class="tabs">';
  tabs.forEach(function(t){h+='<button data-t="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</button>'});h+='</div>';
  if(tab==="obj"){
    if(S){var a=ACTS[S.act-1];h+='<p class="kick">'+a.n+' · '+esc(a.t)+'</p><h2>'+esc(a.goal)+'</h2><p style="color:var(--mute)">'+dateStr()+' · '+S.ret+' retornos</p>'}
    h+='<h3>Como jogar</h3>'+howHTML();
  }else if(tab==="mem"){
    h+='<h2>Memórias</h2><p style="color:var(--mute)">O que você lembra de outras voltas da ampulheta. Elas abrem caminhos novos.</p><ul class="list">';
    if(!META.mems.length)h+='<li><span>Nenhuma ainda. Elas chegam quando a areia volta.</span></li>';
    META.mems.forEach(function(k){h+='<li><span>'+esc(MEMS[k]||k)+'</span></li>'});h+='</ul>';
  }else if(tab==="pes"){
    h+='<h2>Pessoas da corte</h2><ul class="list">';
    Object.keys(PEOPLE).forEach(function(k){var s=META.seenPeople.indexOf(k)>=0;h+='<li class="'+(s?"":"lock")+'"><b>'+(s?esc(k):"???")+'</b><span>'+(s?esc(PEOPLE[k].r):"Ainda não apareceu.")+'</span></li>'});h+='</ul>';
  }else if(tab==="fin"){
    var ks=Object.keys(ENDS);h+='<h2>Finais</h2><p style="color:var(--mute)">'+META.ends.length+' de '+ks.length+' encontrados.</p><ul class="list">';
    ks.forEach(function(k){var s=META.ends.indexOf(k)>=0;h+='<li class="'+(s?"":"lock")+'"><b>'+(s?esc(ENDS[k][0]):"Final escondido")+'</b><span>'+(s?esc(fill(ENDS[k][1])).slice(0,140)+"…":"Continue jogando para descobrir.")+'</span></li>'});h+='</ul>';
  }else{
    h+='<h2>Ajustes</h2><p style="color:var(--mute)">Nome do herói</p><input class="field" id="oNome" maxlength="18" value="'+esc(lsGet("amp2_nome",""))+'" placeholder="Tomás"><button class="btn" id="oNomeOk">Salvar nome</button>'+
     '<h3>Recomeçar</h3><p style="color:var(--mute)">Apaga a história atual. Memórias e finais encontrados continuam.</p><button class="btn" id="oReset">Começar uma história nova</button>'+
     '<h3>Apagar tudo</h3><button class="btn" id="oWipe">Apagar história, memórias e finais</button>';
  }
  h+='<button class="btn main" id="oClose">Fechar</button></div>';
  ovl(h);
  [].forEach.call(document.querySelectorAll("#ov [data-t]"),function(b){b.onclick=function(){openDiary(b.getAttribute("data-t"))}});
  $("#oClose").onclick=function(){ovlClose();if(S&&!$("#game").hidden)show(CUR,CURBEAT);else toTitle()};
  var nk=$("#oNomeOk");if(nk)nk.onclick=function(){var v=$("#oNome").value.replace(/\s+/g," ").trim();if(v&&!/^[A-Za-zÀ-ÿ' -]{1,18}$/.test(v)){toast("Use só letras, espaço, hífen e apóstrofo.");return}lsSet("amp2_nome",v?v.charAt(0).toUpperCase()+v.slice(1):"");toast("O herói se chama "+heroName()+".")};
  var rs=$("#oReset");if(rs)rs.onclick=function(){if(confirmTwice(rs))newGame()};
  var wp=$("#oWipe");if(wp)wp.onclick=function(){if(confirmTwice(wp)){["amp2_save","amp2_meta"].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});META={ends:[],deaths:[],mems:[],seenPeople:[],how:false,best:0};S=null;ovlClose();toTitle()}};
}
function confirmTwice(b){if(b.dataset.c){return true}b.dataset.c=1;b.textContent="Tocar de novo para confirmar";return false}
function askName(after){
  ovl('<div class="box"><p class="kick">O escrivão</p><h2>Qual é o seu nome?</h2><p style="color:var(--mute)">Você é um jovem copista da ilha de Alvor. A corte inteira vai chamá-lo por este nome.</p><input class="field" id="oN" maxlength="18" autocomplete="off" placeholder="Tomás"><button class="btn main" id="oNok">Começar</button></div>');
  var i=$("#oN");setTimeout(function(){try{i.focus()}catch(e){}},60);
  function ok(){var v=i.value.replace(/\s+/g," ").trim();if(v&&!/^[A-Za-zÀ-ÿ' -]{1,18}$/.test(v)){toast("Use só letras, espaço, hífen e apóstrofo.");return}lsSet("amp2_nome",v?v.charAt(0).toUpperCase()+v.slice(1):"");ovlClose();after()}
  $("#oNok").onclick=ok;i.onkeydown=function(e){if(e.key==="Enter")ok()};
}

/* ---------- início ---------- */
function newGame(){S=fresh();save();var go=function(){actIntro()};if(!META.how)openHow(go);else go()}
function toTitle(){
  screen("title");S=lsGet("amp2_save",null);
  var b=$("#tPlay");
  if(S&&!S.ended){var a=ACTS[S.act-1];b.innerHTML='Continuar<small>'+a.n+' · '+esc(a.t)+' · '+S.ret+' retornos</small>'}
  else b.innerHTML='Começar a história<small>Cinco atos · cerca de 40 minutos</small>';
}
$("#tPlay").onclick=function(){
  if(S&&!S.ended){if(S.cur&&CARDS[S.cur])show(CARDS[S.cur],S.curBeat);else nextCard();return}
  if(lsGet("amp2_nome",null)===null)askName(newGame);else newGame();
};
$("#tHow").onclick=function(){openHow()};
$("#tMore").onclick=function(){openDiary(S?"obj":"fin")};
$("#gMenu").onclick=function(){openDiary("obj")};
toTitle();
window.__G={reset:function(){META={ends:[],deaths:[],mems:[],seenPeople:[],how:true,best:0};S=null},get S(){return S},CARDS:CARDS,BEATS:BEATS,pick:function(s){pick(s)},cur:function(){return CUR},META:function(){return META},newGame:newGame,toTitle:toTitle};
})();
</script>
